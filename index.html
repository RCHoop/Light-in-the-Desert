<style id="app-style">
/* Layout: a desert-sunrise hero (cross and saguaro, after the church logo) over an app shell; tabs on top on wide screens, at the bottom on phones. */
:root {
  --bg: #f5f3f6;
  --surface: #ffffff;
  --ink: #2a2340;
  --muted: #625b76;
  --line: #e2dde8;
  --accent: #d9822b;
  --accent-ink: #94490a;
  --accent-soft: #fbecdc;
  --sage: #4f6b4c;
  --sage-soft: #e6eee3;
  --rose: #a3364a;
  --rose-soft: #f8e3e6;
  --live: #c0392b;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-scripture: "Alegreya", Georgia, serif;
}
/* Light is the default for everyone; dark only if a page sets data-theme="dark". */
:root[data-theme="dark"] {
  --bg: #16132a; --surface: #211d37; --ink: #f1eef8; --muted: #a9a2c0; --line: #342e52;
  --accent: #f0a24a; --accent-ink: #f6b866; --accent-soft: #3a2a25; --sage: #a3c09b; --sage-soft: #24302a;
  --rose: #f08a9b; --rose-soft: #3a2230; --live: #ff6b5b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.55; }
a { color: var(--accent-ink); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.2; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.2rem; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Hero */
.hero { position: relative; color: #fff8ee; overflow: hidden; background: #3b2f63; }
.hero svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero .wrap { position: relative; padding-block: 2.2rem 4.4rem; display: grid; gap: .5rem; }
.eyebrow { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; opacity: .92; }
.hero h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); text-shadow: 0 2px 18px rgba(30,20,60,.45); }
.hero .verse { font-family: var(--font-scripture); font-style: italic; font-size: 1.08rem; max-width: 34ch; text-shadow: 0 1px 10px rgba(30,20,60,.5); }

/* Tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.tabs .wrap { display: flex; gap: .1rem; overflow-x: auto; scrollbar-width: none; }
.tab { display: flex; align-items: center; gap: .4rem; padding: .85rem .65rem; color: var(--muted); text-decoration: none; font-weight: 600; font-size: .95rem; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab svg { width: 20px; height: 20px; flex: none; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }

@media (max-width: 700px) {
  .tabs { position: fixed; top: auto; bottom: 0; left: 0; right: 0; border-bottom: 0; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tabs .wrap { justify-content: space-between; gap: 0; padding-left: max(2px, env(safe-area-inset-left, 0px)); padding-right: max(2px, env(safe-area-inset-right, 0px)); }
  .tab { flex: 1 0 auto; min-width: 0; flex-direction: column; gap: .1rem; padding: .5rem 1px .55rem; font-size: .64rem; border-bottom: 0; border-top: 3px solid transparent; }
  .tab[aria-current="page"] { border-top-color: var(--accent); }
  main { padding-bottom: 5.5rem; }
}

main .wrap { padding-block: 1.75rem 3rem; display: grid; gap: 2rem; }
section.view { display: grid; gap: 1.9rem; }
.stack { display: grid; gap: .9rem; align-content: start; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem 1rem; flex-wrap: wrap; }
.kicker { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--sage); }
.muted { color: var(--muted); }
.small { font-size: .9rem; }

.feature { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.4rem; display: grid; gap: 1rem; box-shadow: 0 6px 24px -14px rgba(42,35,64,.35); }
.feature .date { font-family: var(--font-display); font-size: 1.5rem; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip { display: inline-flex; align-items: center; gap: .35rem; font-size: .82rem; font-weight: 600; padding: .2rem .65rem; border-radius: 999px; background: var(--sage-soft); color: var(--sage); }
.chip.warm { background: var(--accent-soft); color: var(--accent-ink); }
.chip.live { background: var(--live); color: #fff; }
.chip.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .chip.live::before { animation: none; } }

.times { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .75rem; }
.times div { border-left: 3px solid var(--accent); padding-left: .7rem; }
.times b { display: block; font-variant-numeric: tabular-nums; font-size: 1.05rem; }

.btns { display: flex; flex-wrap: wrap; gap: .6rem; }
.btn { display: inline-flex; align-items: center; gap: .45rem; padding: .65rem 1.1rem; border-radius: 10px; font-weight: 700; font-size: .95rem; text-decoration: none; border: 1.5px solid var(--accent); color: var(--accent-ink); background: transparent; cursor: pointer; font-family: inherit; }
.btn.primary { background: var(--accent); color: #2a1a08; }
.btn:hover { filter: brightness(1.05); }
.btn svg { width: 18px; height: 18px; }

.list { list-style: none; margin: 0; padding: 0; display: grid; }
.list > li { padding: .9rem 0; border-top: 1px solid var(--line); display: grid; gap: .2rem; }
.list > li:last-child { border-bottom: 1px solid var(--line); }
.list .title { font-weight: 700; font-size: 1.05rem; }

/* Order of service */
.order { list-style: none; margin: 0; padding: 0; }
.order li { display: grid; gap: .15rem; padding: .75rem 0; border-bottom: 1px dotted var(--line); }
.order .part { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.order .who { font-size: 1.05rem; }
.order .msg { font-family: var(--font-display); font-size: 1.25rem; color: var(--accent-ink); }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; }
.two > * { min-width: 0; }

/* Pastor's letter */
.letter { display: grid; gap: .8rem; max-width: 66ch; font-family: var(--font-scripture); font-size: 1.13rem; line-height: 1.65; }
.letter .sig { font-style: italic; color: var(--accent-ink); }
.letter h3 { font-family: var(--font-display); font-size: 1.2rem; margin-top: .6rem; }
.letter blockquote { margin: .2rem 0; }
.letter blockquote.scr { padding-left: 1rem; border-left: 3px solid var(--line); font-style: italic; color: var(--muted); }
.letter blockquote.pull { padding: .7rem 1rem; border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; font-style: italic; text-align: center; }
.letter .orn { text-align: center; color: var(--accent); letter-spacing: .5em; }

/* Scripture */
.passage { display: grid; gap: .55rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--line); }
.passage:last-child { border-bottom: 0; }
.passage .scripture { font-family: var(--font-scripture); font-size: 1.22rem; line-height: 1.65; max-width: 62ch; }
.passage sup { font-family: var(--font-body); font-size: .62em; color: var(--accent-ink); font-weight: 700; margin-right: .15em; }
.scripture u { text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.version { font-size: .8rem; color: var(--muted); }

/* Events */
.event { display: grid; grid-template-columns: 64px 1fr; gap: 1rem; align-items: start; }
.event > div { min-width: 0; }
.dateblock { text-align: center; border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink); padding: .4rem 0; font-variant-numeric: tabular-nums; }
.dateblock .m { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.dateblock .d { font-family: var(--font-display); font-size: 1.6rem; line-height: 1.1; }
.dateblock.weekly { background: var(--sage-soft); color: var(--sage); }
.dateblock.weekly .d { font-size: .95rem; padding: .3rem 0; font-family: var(--font-body); font-weight: 700; }

/* Prayer */
.pgroup { display: grid; gap: .5rem; }
.pgroup h3 { display: flex; align-items: center; gap: .6rem; }
.pgroup h3 .count { font-family: var(--font-body); font-size: .8rem; color: var(--muted); font-weight: 600; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; }
.plist li { padding: .6rem 0; border-top: 1px solid var(--line); }
.plist li:last-child { border-bottom: 1px solid var(--line); }
.plist b { font-weight: 700; }
.plist .rel { color: var(--muted); font-size: .92rem; }
.banner { border-radius: 12px; padding: .9rem 1.1rem; background: var(--sage-soft); color: var(--ink); }
.banner.rose { background: var(--rose-soft); }
.banner strong { color: var(--sage); }
.banner.rose strong { color: var(--rose); }
.urgent h3 { color: var(--rose); }

.banner.join { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .8rem 1.2rem; background: var(--accent-soft); }
.banner.join strong { color: var(--accent-ink); }
.banner.join > div { min-width: 0; flex: 1 1 260px; }

/* Ministries */
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
.ministry { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1.1rem; display: grid; gap: .45rem; align-content: start; min-width: 0; }
.ministry dl { margin: .3rem 0 0; display: grid; gap: .25rem; font-size: .92rem; }
.ministry dl div { display: grid; grid-template-columns: 64px 1fr; gap: .5rem; }
.ministry dt { color: var(--muted); font-weight: 600; }
.ministry dd { margin: 0; }

/* Editing tools (shown only to people who can edit) */
.adminbar { border: 1.5px dashed var(--accent); border-radius: 12px; padding: .75rem 1rem; display: flex; flex-wrap: wrap; gap: .3rem 1rem; align-items: center; justify-content: space-between; font-size: .92rem; }
.adminbar strong { color: var(--accent-ink); }
.tools { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-top: .4rem; font-size: .88rem; }
.tbtn { font: inherit; font-size: .82rem; font-weight: 700; padding: .2rem .65rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.tbtn.danger { color: var(--rose); border-color: var(--rose); }
form.editor { display: grid; gap: .7rem; padding: 1.1rem; border: 1.5px solid var(--accent); border-radius: 12px; background: var(--surface); }
form.editor label { display: grid; gap: .25rem; font-weight: 600; font-size: .9rem; }
form.editor input, form.editor textarea { font: inherit; font-weight: 400; font-size: 1rem; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; min-width: 0; }
form.editor .row, form.checker .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .7rem; }
form.editor select, form.checker input { font: inherit; font-weight: 400; font-size: 1rem; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; min-width: 0; }
form.checker { display: grid; gap: .7rem; padding: 1.1rem; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
form.checker label { display: grid; gap: .25rem; font-weight: 600; font-size: .9rem; }
.conflicts { border-radius: 10px; padding: .75rem 1rem; background: var(--rose-soft); color: var(--ink); font-size: .95rem; }
.conflicts strong { color: var(--rose); }

.ok { border-radius: 10px; padding: .75rem 1rem; background: var(--sage-soft); }
.ok strong { color: var(--sage); }
.warn { color: var(--rose); font-weight: 600; }
.dateblock.bk { background: var(--sage-soft); color: var(--sage); }

.teaser b { color: var(--accent-ink); }
.teaser:hover { border-color: var(--accent); }
.post { display: grid; gap: .6rem; }
form.editor label.check { display: flex; align-items: center; gap: .5rem; }
form.editor label.check input { width: 1.2rem; height: 1.2rem; }
.draftnote { justify-self: start; font-size: .85rem; font-weight: 600; padding: .2rem .6rem; border-radius: 999px; background: var(--warm, #f6e7cf); color: var(--accent-ink); }
details.postd summary { padding: .2rem 0; }
details.postd .post { margin-top: 1rem; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: .5rem 0; width: 100%; }
ul.bldg { list-style: none; margin: 0; padding: 0; display: grid; gap: .3rem; font-size: .95rem; }

/* Faith & leadership */
details { border-top: 1px solid var(--line); padding: .75rem 0; }
details:last-of-type { border-bottom: 1px solid var(--line); }
summary { cursor: pointer; font-weight: 700; }
ol.faith { margin: .6rem 0 0; padding-left: 1.3rem; display: grid; gap: .55rem; }
ol.faith .refs { color: var(--rose); font-size: .9rem; }
.people { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1.2rem; margin-top: .6rem; }
.people ul { list-style: none; margin: .3rem 0 0; padding: 0; }

.copyrow { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.copyrow code { font-family: var(--font-body); font-weight: 600; user-select: all; }
.sharelink { display: inline-flex; align-items: center; gap: .3rem; font-size: .85rem; font-weight: 700; color: var(--accent-ink); text-decoration: none; margin-top: .3rem; }
.sharelink svg { width: 16px; height: 16px; }
.sharetop { margin-bottom: 1.1rem; }
.btn.sharebig { width: 100%; justify-content: center; font-size: 1.1rem; padding: .9rem 1rem; }
button.sharelink { background: none; border: 0; padding: 0; font-family: inherit; cursor: pointer; }
.sharepanel { flex-basis: 100%; display: grid; gap: .6rem; margin-top: .5rem; padding: 1rem; border: 1.5px solid var(--accent); border-radius: 12px; background: var(--surface); color: var(--ink); font-weight: 400; }
.sharepanel textarea { font: inherit; font-size: 1rem; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; min-width: 0; resize: vertical; }
.sharepanel .sharepic { display: block; width: 100%; max-width: 420px; height: auto; border-radius: 10px; -webkit-touch-callout: default; user-select: auto; }
.sharepanel .picslot:empty { display: none; }
.sharepanel .note { font-size: .92rem; color: var(--muted); }
.copybtn { font: inherit; font-size: .82rem; font-weight: 700; padding: .25rem .6rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
ol.steps { margin: 0; padding-left: 1.2rem; display: grid; gap: .35rem; }

footer { color: var(--muted); font-size: .85rem; }

<script type="application/json" id="litd-data">{"posts": [{"id": "p1", "date": "2026-11-22", "title": "Why Do We Give Thanks?", "verse": "Philippians 4:6–7", "body": "In the fall of 1621, after a harsh winter that killed over half of the original Mayflower passengers, the remaining group chose to celebrate their harvest and thank God for all that He had done for them. How “unhuman” of them to stop in the midst of all their daily struggles and massive losses and thank the God that had brought them to this harsh new land.\n\nThe human condition is most often filled with stress and fatigue. However, these new settlers knew something that many of us often forget: thanking God is a blessing that heals that human condition. Thanking God is for “our” benefit, not for God.\n\nThroughout scripture God instructs us not only to worship Him, but to thank Him. We are to thank Him for both the good and the bad. Thanking God shifts our focus from worries to His faithfulness. God tells us in Romans 8 that He can cause all things to work for good. Trusting and thanking Him actually guards our hearts and minds from all anxiety.\n\nThus, the message today will focus on the many benefits of simply saying, “Thank You God.”"}], "bookings": [], "events": [{"id": "e0", "date": "2026-11-22", "time": "After church", "title": "Shoe boxes go out", "where": "At the church", "note": ""}, {"id": "e1", "date": "2026-11-24", "time": "", "start": "18:30", "end": "20:00", "title": "Celebrate Recovery", "where": "At the church", "note": "With Pastor Bill Reasons"}, {"id": "e2", "date": "2026-11-26", "time": "", "title": "Thanksgiving Day", "where": "", "note": "Give thanks with family and friends."}, {"id": "e3", "date": "2026-12-05", "time": "8:00 AM", "title": "Men's Fellowship", "where": "At the church", "note": ""}, {"id": "e4", "date": "2026-12-12", "time": "10:00 AM", "title": "Women's Fellowship", "where": "At the church", "note": ""}], "announcements": [{"id": "mwsioboyl8se", "title": "New Con  sin has left us. The work of Jesus was not finished so we could languish in the mud of our regrets. If you are broken, if you feel disqualified, if you are weighed down by a debt you can never repay, I have one urgent plea for you: Take the offer.\n\nRepentance simply means to change your mind and change your ways — to turn around. But let me be clear: this is a turnaround you can never accomplish under your own strength. It requires the explosive, transforming power of Jesus in your life. This is not a burden of rules; it is a freedom, a commission, and a daily empowerment. We are all in this together. Let us take His hand, accept His signed walking papers, and walk out of the dark together.\n\nRCH\n\n## Preface: From Six Hundred and Thirteen to One\n\nThe rabbis went through the Torah and counted the commandments. They arrived at six hundred and thirteen.\n\nThree hundred and sixty-five of them prohibitions — one, they said, for every day of the solar year. Two hundred and forty-eight positive commands — one for every part of the human body. A whole life, every day of it and every limb of it, spoken for.\n\nSix hundred and thirteen is a great deal to carry.\n\nAnd so, for as long as there has been a Law, there have been people trying to say what it comes down to. Not to shrink it. To find its heart. Hillel, a generation before Jesus, was asked to teach the whole Torah while standing on one foot, and answered: what is hateful to you, do not do to your neighbor — that is the whole Torah; the rest is commentary. Centuries after Jesus, a rabbi named Simlai preached a sermon that walked the whole thing down like a staircase — six hundred and thirteen given to Moses, David bringing them to eleven, Isaiah to six, Micah to three, to do justly, and to love mercy, and to walk humbly with thy God, Isaiah again to two — until the sermon comes to rest on Habakkuk, and on a single line: the just shall live by his faith. They were not being careless with the Law. They believed that if you understood what all of it was for, you could say it in a breath.\n\nGod had already done this once Himself. At Sinai, out of everything He might have said, He gave ten. Scripture does not call them commandments. It calls them aseret ha-devarim — the Ten Words. Not a legal code but a covenant summary, cut into stone, and understood ever since as two tables: one turned toward God, one turned toward the neighbor.\n\nThen, in the last week of His life, a lawyer stood up in a crowd and asked Jesus which commandment was the greatest.\n\nIt was a real question, argued in the schools of that day — which of the six hundred and thirteen were weighty and which were light, and whether any single one of them held the rest. He was asking Jesus to stand on one foot.\n\nAnd Jesus answered him:\n\n> Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind. This is the first and great commandment. And the second is like unto it, Thou shalt love thy neighbor as thyself. On these two commandments hang all the law and the prophets.\n\nHe was doing what His tradition had always done. But no one, so far as we can tell, had ever put those two particular verses together before — one from Deuteronomy, one from Leviticus, welded into a single answer. That pairing appears to be His own.\n\nSix hundred and thirteen, brought down to two.\n\nAnd then, before that same week was out, on a hill outside the city wall, the same man drew the last breath He had and brought it down to one.\n\n>> It is finished.\n\nSix hundred and thirteen commandments. Ten words at Sinai. Two in a crowded street. One word from a cross.\n\nThat descent is what this book is about. Nothing was lost on the way down. The Law was not being emptied out but gathered up, until everything it had been reaching toward for fifteen centuries arrived in a single Greek verb — spoken by a dying man who was not, as it happens, dying for Himself.\n\nTen chapters follow. They take that one word apart and put it back together: its grammar, its history, the courtroom it settled, the gate it opened, the creation it swept in, the love it makes possible, and the invitation it is still holding out to you.\n\nBut if you read no further than this page, you already have the whole of it.\n\nHe paid it. All of it. For you.\n\nDone."}]}</script>

/* Live status in Arizona time (UTC-7 all year) */
function liveStatus() {
  const az = new Date(Date.now() - 7 * 3600 * 1000);
  const day = az.getUTCDay(), mins = az.getUTCHours() * 60 + az.getUTCMinutes();
  const toMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  return CHURCH.liveWindows.some(w => w.day === day && mins >= toMin(w.start) - 10 && mins <= toMin(w.end));
}

DATA.bookings = DATA.bookings || [];
const ROOMS = ["Whole building", "Sanctuary", "Fellowship Room", "Kitchen", "Children's Ministry Building"];
const DOW = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const toMin = (t) => { const [h, m] = String(t || "0:0").split(":").map(Number); return h * 60 + (m || 0); };
const fmtTime = (t) => { if (!t) return ""; let [h, m] = t.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${String(m).padStart(2, "0")} ${ap}`; };
const fmtRange = (a, b) => `${fmtTime(a)}–${fmtTime(b)}`;
/* Event times: new events store start/end ("18:30"); older ones keep a free-text time. */
function parseTime(t) {
  const m = String(t || "").trim().toLowerCase().match(/^(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?|noon)?$/);
  if (!m) return "";
  let h = +m[1]; const min = +(m[2] || 0), ap = m[3] || "";
  if (h > 23 || min > 59) return "";
  if (ap.startsWith("p") && h < 12) h += 12;
  if (ap.startsWith("a") && h === 12) h = 0;
  return `${String(h).padStart(2, "0")}:${String(min).padStart(2, "0")}`;
}
const evTime = (e) => e.start ? (e.end ? fmtRange(e.start, e.end) : fmtTime(e.start)) : (e.time || "");
const dUTC = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const addDays = (iso, n) => new Date(dUTC(iso).getTime() + n * 86400000).toISOString().slice(0, 10);
const dowOf = (iso) => dUTC(iso).getUTCDay();
const fmtDay = (iso) => dUTC(iso).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
const sameRoom = (a, b) => { const x = (a || "").trim().toLowerCase(), y = (b || "").trim().toLowerCase(); return !x || !y || x === y || x === "whole building" || y === "whole building"; };
const overlaps = (s1, e1, s2, e2) => toMin(s1) < toMin(e2) && toMin(s2) < toMin(e1);
const occursOn = (b, iso) => b.repeat === "weekly" ? iso >= b.date && (!b.until || iso <= b.until) && dowOf(iso) === dowOf(b.date) : iso === b.date;
function occurrences(b) {
  if (b.repeat !== "weekly") return [b.date];
  const out = [], end = b.until || addDays(b.date, 364);
  for (let d = b.date; d <= end && out.length < 60; d = addDays(d, 7)) out.push(d);
  return out;
}
const churchUseOn = (u, iso) => dowOf(iso) === u.dow && (!u.nth || Math.ceil(dUTC(iso).getUTCDate() / 7) === u.nth);
/* A clash is "hard" when both times are known and overlap; "soft" when an event has no end time to compare. */
const sameTitle = (a, b) => { const x = String(a || "").trim().toLowerCase(), y = String(b || "").trim().toLowerCase(); return !!x && !!y && (x.includes(y) || y.includes(x)); };
function clashList(b, opt = {}) {
  const out = [];
  for (const d of occurrences(b)) {
    if (d < todayAZ()) continue;
    for (const o of DATA.bookings) if (o.id !== opt.booking && occursOn(o, d) && sameRoom(o.room, b.room) && overlaps(o.start, o.end, b.start, b.end))
      out.push({ text: `${fmtDay(d)}: ${o.group}, ${fmtRange(o.start, o.end)}${o.room ? " · " + o.room : ""}` });
    const timed = DATA.events.filter(e => e.date === d && e.id !== opt.event && e.start && e.end);
    for (const u of CHURCH.uses) if (churchUseOn(u, d) && sameRoom(u.room, b.room) && overlaps(u.start, u.end, b.start, b.end)
      && !sameTitle(u.title, opt.title) && !timed.some(e => sameTitle(e.title, u.title)))
      out.push({ text: `${fmtDay(d)}: ${u.title} (church), about ${fmtRange(u.start, u.end)}` });
    for (const e of DATA.events) if (e.date === d && e.id !== opt.event) {
      if (e.start && e.end) { if (overlaps(e.start, e.end, b.start, b.end)) out.push({ text: `${fmtDay(d)}: ${e.title} (church event), ${fmtRange(e.start, e.end)}` }); }
      else if (opt.event === undefined) out.push({ soft: true, text: `${fmtDay(d)}: ${e.title} (church event${evTime(e) ? ", " + evTime(e) : ""}). Check the times.` });
    }

  }

}
const findConflicts = (b, ignoreId) => clashList(b, { booking: ignoreId }).map(c => c.text);

  const o = list.filter(b => b.repeat !== "weekly").sort((a, b) => a.date.localeCompare(b.date) || toMin(a.start) - toMin(b.start));

async function save(next) {
  saving = true; msg = "Saving…"; render();
  try {
    await ART.publish(pageHtml(next));
    msg = "Saved. Updating the app…"; render();
  } catch (err) {
    saving = false;
    const c = err && err.code;
    if (c === "conflict") msg = "Someone else saved a change first. Loading the latest version…";
    else if (["not_writer", "not_granted", "not_declared", "consent_required", "capability_disabled", "capability_removed"].includes(c)) { admin = false; editing = null; msg = ""; }
    else if (c === "rate_limited") msg = "Too many saves in a row. Wait a minute, then try again.";
    else if (c === "too_large") msg = "That's too much text to save. Shorten it and try again.";
    else msg = "Couldn't save. Check your connection and try again.";
    render();
  }
}

  else if (act === "del") { confirmDel = { kind, id }; editing = null; }

      for (const g of Object.keys(next.prayer.groups)) next.prayer.groups[g] = next.prayer.groups[g].filter(x => x.id !== id);
      confirmDel = null; save(next); return;
    }
    const key = COLS[kind] ? COLS[kind].key : kind === "event" ? "events" : kind === "book" ? "bookings" : kind === "post" ? "posts" : "announcements";
    next[key] = (next[key] || []).filter(x => x.id !== id);
    confirmDel = null; save(next); return;

});

function render() {
  const raw = (location.hash || "#home").slice(1);
  const id = { involved: "connect", about: "connect" }[raw] || raw;

  document.getElementById("tabs").innerHTML = TABS.map(([k, label]) =>

  document.getElementById("views").innerHTML = `<section class="view">${["home", "events", "pastor", "prayer", "kids", "standing"].includes(view) ? adminBar() : ""}${VIEWS[view]()}</section>`;
  document.getElementById("foot").innerHTML = `<span>${esc(CHURCH.name)}</span><span>${esc(CHURCH.address)} · ${esc(CHURCH.phone)}</span><span><em>Under the Same Management for 2,000 Years</em></span><span class="small">Public copy: Nov 23, 2026</span>`;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest(".copybtn"); if (!b) return;
  const el = document.getElementById(b.dataset.copy);
  const done = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1500); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected"; };
  try { navigator.clipboard.writeText(el.textContent).then(done, fallback); } catch { fallback(); }
});
/* Share picture: the sunrise header drawn once as a PNG, so a tap can send it right away with the text. */
const PIC_FILE = "light-in-the-desert.png";
let SHARE_FILE = null, SHARE_PIC = PIC_FILE;
async function makeShareFile() {
  if (SHARE_FILE) return;
  try {
    const res = await fetch(PIC_FILE);
    if (!res.ok) return;
    const blob = await res.blob();
    if (typeof File === "function") SHARE_FILE = new File([blob], PIC_FILE, { type: "image/png" });
  } catch { SHARE_FILE = null; }
}
/* Share by text opens a small panel right under the button: the church picture, the message,
   Text it (opens Messages with the message ready), Share with picture (the phone's own share menu,
   where the phone has one), Copy message and Close. */
const canShareSheet = () => typeof navigator.share === "function";
const picHtml = () => `<img class="sharepic" src="${esc(PIC_FILE)}" alt="Light in the Desert church picture, sunrise over the desert" width="1200" height="500">
    <p class="note">${canShareSheet() ? "Share with picture sends the picture and the message together. Or " : "To send the picture too, "}press and hold the picture, tap Copy (or Save to Photos), then paste or attach it in your text.</p>`;
function sharePanel(a) {
  const msg = shareMsg(a.dataset.share, a.dataset.after || "");
  const box = document.createElement("div");
  box.className = "sharepanel"; box.setAttribute("role", "group"); box.setAttribute("aria-label", "Share by text");
  box.innerHTML = `<strong>Send this in a text</strong>
    <div class="picslot">${picHtml()}</div>
    <textarea rows="4" aria-label="Message to send" autocapitalize="off" autocorrect="off" spellcheck="false">${esc(msg)}</textarea>
    <div class="btns"><a class="btn primary sharebig" href="${esc(smsBody("", msg))}">${icon("text")}Text it</a>${canShareSheet() ? '<button type="button" class="btn sharebig" data-sp="sheet">' + icon("share") + "Share with picture</button>" : ""}<button type="button" class="btn" data-sp="copy">Copy message</button><button type="button" class="tbtn" data-sp="close">Close</button></div>
    <p class="note" aria-live="polite">Text it opens Messages with the message ready; just pick who to send it to. Or tap Copy message and paste it into a text.</p>`;
  box.dataset.msg = msg;
  return box;
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-share]");
  if (a) {
    e.preventDefault();
    const open = a.nextElementSibling && a.nextElementSibling.classList.contains("sharepanel");
    document.querySelectorAll(".sharepanel").forEach(p => p.remove());
    document.querySelectorAll("[data-share]").forEach(x => x.setAttribute("aria-expanded", "false"));
    if (!open) {
      const box = sharePanel(a); a.after(box); a.setAttribute("aria-expanded", "true");
      makeShareFile();
    }
    return;
  }
  const b = e.target.closest("[data-sp]"); if (!b) return;
  const box = b.closest(".sharepanel"), note = box.querySelector(".note"), ta = box.querySelector("textarea"), msg = box.dataset.msg;
  if (b.dataset.sp === "close") { if (box.previousElementSibling) box.previousElementSibling.setAttribute("aria-expanded", "false"); box.remove(); return; }
  if (b.dataset.sp === "copy") {
    const text = ta.value;
    const selectIt = () => { try { ta.focus(); ta.select(); ta.setSelectionRange(0, text.length); } catch {} };
    const done = () => { note.textContent = "Copied. Open a new text and paste it."; };
    const manual = () => { selectIt(); note.textContent = "Your phone blocked copying here. The message is selected: tap Copy in the bubble, or press and hold it and tap Select All, then Copy."; };
    selectIt();
    let ok = false; try { ok = document.execCommand("copy"); } catch {}
    if (ok) { done(); return; }
    try { navigator.clipboard.writeText(text).then(done, manual); } catch { manual(); }
    return;
  }
  if (b.dataset.sp === "sheet") {
    let withPic = false;
    try { withPic = !!SHARE_FILE && typeof navigator.canShare === "function" && navigator.canShare({ files: [SHARE_FILE] }); } catch {}
    const data = withPic ? { title: "Light in the Desert", text: ta.value, files: [SHARE_FILE] } : { title: "Light in the Desert", text: ta.value };
    navigator.share(data).catch(err => { if (!err || err.name !== "AbortError") note.textContent = "Your phone's share menu didn't open. Tap Text it or Copy message instead."; });
  }
});
addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
render();
setTimeout(makeShareFile, 400);
setInterval(() => { if (!editing && !confirmDel && !saving && !document.querySelector(".sharepanel") && ["home", "watch"].includes((location.hash || "#home").slice(1))) render(); }, 60000);
